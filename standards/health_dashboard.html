<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoOps 实时健康大屏</title>
<style>
  :root{--bg:#0b0f17;--panel:#131a26;--line:#1f2a3a;--fg:#e6edf7;--mut:#7d8aa0;
        --ok:#22c55e;--warn:#eab308;--bad:#ef4444;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#12203a 0%,var(--bg) 55%);
       color:var(--fg);font:14px/1.5 -apple-system,Segoe UI,Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
  header{display:flex;align-items:center;gap:16px;padding:20px 28px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  #overall{margin-left:auto;font-weight:700;padding:6px 16px;border-radius:999px;font-size:13px}
  .badge-healthy{background:rgba(34,197,94,.15);color:var(--ok);border:1px solid rgba(34,197,94,.4)}
  .badge-degraded{background:rgba(234,179,8,.15);color:var(--warn);border:1px solid rgba(234,179,8,.4)}
  .badge-critical{background:rgba(239,68,68,.15);color:var(--bad);border:1px solid rgba(239,68,68,.45);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  #updated{color:var(--mut);font-size:12px}
  main{padding:24px 28px;display:grid;gap:20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .card{background:linear-gradient(180deg,#151d2b,#111827);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .dot.ok{background:var(--ok);box-shadow:0 0 10px rgba(34,197,94,.7)}
  .dot.bad{background:var(--bad);box-shadow:0 0 10px rgba(239,68,68,.7)}
  .card .v{font-size:24px;font-weight:700;margin-top:8px}
  .card .d{color:var(--mut);font-size:12px;margin-top:4px;word-break:break-all}
  .wide{grid-column:1/-1}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  pre{background:#0d1320;border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;max-height:320px;color:#b8c6dd;font-size:12px}
  .pill{display:inline-block;background:#0d1320;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0;font-size:12px;color:#b8c6dd}
  .err{color:var(--bad)}
  @media(max-width:820px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>⚙️ AutoOps 实时健康大屏</h1>
  <span id="updated">加载中…</span>
  <span id="overall" class="badge-degraded">—</span>
</header>
<main>
  <section class="cards" id="cards"></section>
  <section class="row">
    <div class="card">
      <div class="k">📈 营收 / 订单快照</div>
      <div id="snap" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <div class="k">🧠 最近计划 (hidden_plan)</div>
      <pre id="plan">—</pre>
    </div>
  </section>
  <section class="card wide">
    <div class="k">🚨 告警与降级</div>
    <div id="issues" style="margin-top:10px"></div>
  </section>
</main>
<script>
const CHECKS = [
  ['heartbeat','心跳','age_min',' 分钟前'],
  ['storefront','收银台','env',null],
  ['conversion','支付转化','streak',' 次连续零支付'],
  ['promo','推广队列','pending',' 篇待发'],
  ['files','关键文件','missing',null],
  ['credentials','凭据','missing',null],
  ['alert_channel','告警通道','channel',null],
];
function val(c, v){
  if(v===null||v===undefined) return '—';
  if(Array.isArray(v)) return v.length? v.join(', ') : 'OK';
  if(typeof v==='object') return Object.entries(v).map(([k,x])=>k+':'+x).join('  ');
  return String(v)+(c[3]||'');
}
function pill(txt, bad){ return '<span class="pill'+(bad?' err':'')+'">'+txt+'</span>' }
async function tick(){
  try{
    const [h, m] = await Promise.all([
      fetch('/health',{cache:'no-store'}).then(r=>r.json()),
      fetch('/metrics',{cache:'no-store'}).then(r=>r.json()).catch(()=>({metrics:[],plan:null})),
    ]);
    const o = document.getElementById('overall');
    o.textContent = h.overall.toUpperCase();
    o.className = 'badge-'+h.overall;
    document.getElementById('updated').textContent = '更新于 '+new Date(h.at).toLocaleTimeString();
    document.getElementById('cards').innerHTML = CHECKS.map(([id,label,field,suffix])=>{
      const c = h.checks[id]||{};
      return '<div class="card"><div class="k"><span class="dot '+(c.ok?'ok':'bad')+'"></span>'+label+'</div>'
        + '<div class="v">'+(c.ok?'正常':'异常')+'</div>'
        + '<div class="d">'+val([id,label,field,suffix], c[field])+'</div></div>';
    }).join('');
    const snap = (m.plan&&m.plan.snapshot)||{};
    document.getElementById('snap').innerHTML =
      pill('营收 ¥'+(snap.revenue_cny??'—'))+
      pill('已支付 '+(snap.orders?.paid??'—'))+
      pill('未支付 '+(snap.orders?.unpaid??'—'))+
      pill('hot 线索 '+(snap.leads?.hot??'—'))+
      pill('warm 线索 '+(snap.leads?.warm??'—'))+
      pill('Arcade 用户 '+(snap.arcade_users??'—'))+
      pill('待发推广 '+(snap.promos?.pending??'—'))+
      pill('AI_KEY '+(snap.ai_key?'就绪':'缺失'), !snap.ai_key);
    document.getElementById('plan').textContent = m.plan ? JSON.stringify({focus:m.plan.focus,tasks:m.plan.tasks},null,2) : '—';
    document.getElementById('issues').innerHTML =
      (h.critical||[]).map(x=>pill('CRITICAL: '+x,true)).join('') +
      (h.degraded||[]).map(x=>pill('degraded: '+x,false)).join('') || '<span class="d" style="color:#7d8aa0">无</span>';
  }catch(e){
    document.getElementById('updated').textContent = '连接失败: '+e.message;
  }
}
tick(); setInterval(tick, 10000);
</script>
</body>
</html>
