<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丙大山·数字资产商城 - 真实可验证数字资产交易</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0f1a; --card:#111827; --border:#1f2937; --text:#e5e7eb; --muted:#9ca3af; --accent:#22c55e; --accent-dim:#16a34a; --warn:#f59e0b; --danger:#ef4444; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC","Inter",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.logo{font-weight:700;font-size:1.25rem;color:var(--accent)}
nav a{color:var(--muted);margin-left:24px;text-decoration:none;font-size:.9rem}
nav a:hover{color:var(--text)}
h1{font-size:2rem;font-weight:700;margin-bottom:8px}
.subtitle{color:var(--muted);margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .label{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .value{font-size:1.5rem;font-weight:700;color:var(--accent);margin-top:4px}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:.2s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card-header{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.card-type{font-size:.7rem;background:var(--accent);color:var(--bg);padding:2px 8px;border-radius:4px;font-weight:600}
.card-price{font-weight:700;color:var(--accent);font-size:1.1rem}
.card-body{padding:16px}
.card-title{font-weight:600;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.card-proof{font-family:monospace;font-size:.7rem;color:var(--muted);background:var(--bg);padding:8px;border-radius:6px;margin-bottom:12px;word-break:break-all}
.card-actions{display:flex;gap:8px}
.btn{flex:1;padding:10px 16px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;transition:.2s}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent-dim)}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-secondary:hover{background:#374151}
.btn:disabled{opacity:.5;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;visibility:hidden;transition:.2s}
.modal.open{opacity:1;visibility:visible}
.modal-content{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:90%;max-width:500px;max-height:90vh;overflow:auto}
.modal-title{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.modal-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.modal-row:last-child{border-bottom:none}
.modal-proof{font-family:monospace;font-size:.7rem;color:var(--muted);background:var(--bg);padding:12px;border-radius:8px;margin:12px 0;word-break:break-all}
.toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px 24px;z-index:200;transform:translateY(100px);opacity:0;transition:.3s}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:var(--accent)}
.toast.error{border-color:var(--danger)}
.loading{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{grid-column:1/-1;text-align:center;padding:48px;color:var(--muted)}
.plan-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;transition:.2s;position:relative}
.plan-card:hover{border-color:var(--accent);transform:translateY(-4px)}
.plan-card.featured{border-color:var(--accent);box-shadow:0 0 24px rgba(34,197,94,.15)}
.plan-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--bg);padding:4px 12px;border-radius:20px;font-size:.7rem;font-weight:700}
.plan-name{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.plan-price{font-size:2rem;font-weight:700;color:var(--accent);margin-bottom:4px}
.plan-cycle{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.plan-features{list-style:none;text-align:left;margin-bottom:20px}
.plan-features li{padding:6px 0;font-size:.85rem;color:var(--muted)}
.plan-features li::before{content:"✓ ";color:var(--accent);font-weight:700}
.usage-bar{background:var(--bg);border-radius:8px;height:8px;margin:12px 0;overflow:hidden}
.usage-bar-fill{height:100%;background:var(--accent);border-radius:8px;transition:width .3s}
.upgrade-modal{text-align:center;padding:16px}
.upgrade-modal h3{font-size:1.25rem;margin-bottom:8px}
.upgrade-modal p{color:var(--muted);margin-bottom:20px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">丙大山·数字资产商城</div>
    <nav><a href="/">首页</a><a href="/report.html">价值证明</a></nav>
  </header>
  <h1>真实可验证数字资产</h1>
  <p class="subtitle">33,426 条结构化资产 · 每条附带 SHA256 校验证明 · 支持即时交付</p>
  
  <div class="stats" id="stats">
    <div class="stat"><div class="label">怼资产数</div><div class="value" id="stat-total">—</div></div>
    <div class="stat"><div class="label">资产类型</div><div class="value" id="stat-types">—</div></div>
    <div class="stat"><div class="label">价格区间</div><div class="value" id="stat-price">—</div></div>
    <div class="stat"><div class="label">可交付</div><div class="value" id="stat-deliverable">100%</div></div>
  </div>
  
  <div class="filters" id="filters"><button class="filter-btn active" data-type="all">全部</button></div>
  
  <div class="grid" id="grid"><div class="empty">加载中...</div></div>
</div>

<section id="plans-section" style="margin-top:48px">
  <h2 style="font-size:1.5rem;margin-bottom:8px">选择订阅方案</h2>
  <p class="subtitle" style="margin-bottom:24px">按月或按年订阅，年付享 8 折优惠</p>
  <div class="billing-toggle" style="display:flex;gap:12px;margin-bottom:24px">
    <button class="filter-btn active" id="cycle-monthly" onclick="setCycle('monthly')">按月付费</button>
    <button class="filter-btn" id="cycle-yearly" onclick="setCycle('yearly')">按年付费 <span style="color:var(--accent);font-size:.75rem">省 20%</span></button>
  </div>
  <div class="grid" id="plans-grid"></div>
</section>

<section id="usage-section" style="margin-top:48px;display:none">
  <h2 style="font-size:1.5rem;margin-bottom:8px">我的用量</h2>
  <div class="stats" id="usage-stats">
    <div class="stat"><div class="label">本月积分</div><div class="value" id="usage-credits">—</div></div>
    <div class="stat"><div class="label">已使用</div><div class="value" id="usage-used">—</div></div>
    <div class="stat"><div class="label">剩余</div><div class="value" id="usage-remaining">—</div></div>
    <div class="stat"><div class="label">下次重置</div><div class="value" id="usage-reset">—</div></div>
  </div>
</section>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-title" id="modal-title">购买确认</div>
    <div class="modal-row"><span>资产类型</span><span id="m-type">—</span></div>
    <div class="modal-row"><span>参考价格</span><span id="m-price">—</span></div>
    <div class="modal-row"><span>最低成交</span><span id="m-floor">—</span></div>
    <div class="modal-row"><span>交付形式</span><span id="m-deliver">—</span></div>
    <div class="modal-proof" id="m-proof">—</div>
    <div class="card-actions">
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="btn-pay" onclick="initPay()">立即支付 <span id="pay-loading" class="loading" style="display:none"></span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allAssets = [];
let currentFilter = "all";

async function loadManifest() {
  try {
    const res = await fetch("/api/assets");
    const data = await res.json();
    document.getElementById("stat-total").textContent = (data.total || 33426).toLocaleString();
    document.getElementById("stat-types").textContent = "10";
  } catch {}
}

async function loadSample() {
  try {
    const res = await fetch("/api/assets?sample=1&limit=500");
    const data = await res.json();
    if (data.sample) allAssets = data.sample;
    else if (data.assets) allAssets = data.assets;
    renderFilters();
    renderGrid();
  } catch (e) {
    document.getElementById("grid").innerHTML = '<div class="empty">无法加载样例,请刷新重试</div>';
  }
}

function renderFilters() {
  const types = [...new Set(allAssets.map(a => a.type))];
  const filterDiv = document.getElementById("filters");
  filterDiv.innerHTML = '<button class="filter-btn active" data-type="all">全部</button>' +
    types.map(t => '<button class="filter-btn" data-type="' + t + '">' + t + '</button>').join("");
  filterDiv.querySelectorAll(".filter-btn").forEach(btn => {
    btn.onclick = () => {
      filterDiv.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.type;
      renderGrid();
    };
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const filtered = currentFilter === "all" ? allAssets : allAssets.filter(a => a.type === currentFilter);
  if (!filtered.length) {
    grid.innerHTML = '<div class="empty">暂无该类型资产</div>';
    return;
  }
  grid.innerHTML = filtered.map(a => `
    <article class="card">
      <div class="card-header">
        <span class="card-type">${a.type}</span>
        <span class="card-price">¥${a.price_cny_ref.toFixed(2)}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${a.name}</div>
        <div class="card-meta">ID: ${a.asset_id} | 来源: ${a.source}</div>
        <div class="card-proof">Proof: ${a.proof}</div>
        <div class="card-actions">
          <button class="btn btn-secondary" onclick="viewDetail('${a.asset_id}')">查看详情</button>
          <button class="btn btn-primary" onclick="openModal('${a.asset_id}')">购买</button>
        </div>
      </div>
    </article>
  `).join("");
}

function openModal(assetId) {
  const a = allAssets.find(x => x.asset_id === assetId);
  if (!a) return;
  document.getElementById("modal-title").textContent = a.name;
  document.getElementById("m-type").textContent = a.type;
  document.getElementById("m-price").textContent = "¥" + a.price_cny_ref.toFixed(2);
  document.getElementById("m-floor").textContent = "¥" + a.price_cny_floor.toFixed(2);
  document.getElementById("m-deliver").textContent = a.deliverable;
  document.getElementById("m-proof").textContent = "SHA256: " + a.proof;
  document.getElementById("btn-pay").dataset.asset = assetId;
  document.getElementById("modal").classList.add("open");
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
}

async function initPay() {
  const btn = document.getElementById("btn-pay");
  const assetId = btn.dataset.asset;
  const a = allAssets.find(x => x.asset_id === assetId);
  if (!a) return;
  btn.disabled = true;
  btn.querySelector("#pay-loading").style.display = "inline-block";
  try {
    const res = await fetch("/api/purchase", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({asset_id: assetId, amount_cny: a.price_cny_ref})
    });
    const data = await res.json();
    if (data.checkout_url) {
      window.location.href = data.checkout_url;
    } else if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      showToast("支付链路未配置,请联系客服", "error");
    }
  } catch (e) {
    showToast("请求失败: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.querySelector("#pay-loading").style.display = "none";
  }
}

function showToast(msg, type="") {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type + " show";
  setTimeout(() => t.classList.remove("show"), 3000);
}

let currentCycle = "monthly";
let customerId = localStorage.getItem("customer_id") || "";

function setCycle(c) {
  currentCycle = c;
  document.getElementById("cycle-monthly").classList.toggle("active", c === "monthly");
  document.getElementById("cycle-yearly").classList.toggle("active", c === "yearly");
  renderPlans();
}

async function renderPlans() {
  const grid = document.getElementById("plans-grid");
  try {
    const res = await fetch("/api/pricing?action=compare");
    const data = await res.json();
    if (!data.ok) { grid.innerHTML = '<div class="empty">加载失败</div>'; return; }
    const plans = data.data;
    grid.innerHTML = plans.map((p, i) => {
      const price = currentCycle === "monthly" ? p.monthly_price : p.yearly_price;
      const cycleLabel = currentCycle === "monthly" ? "/月" : "/年";
      const featured = i === 1 ? " featured" : "";
      const badge = i === 1 ? '<div class="plan-badge">推荐</div>' : "";
      return '<div class="plan-card' + featured + '">' + badge +
        '<div class="plan-name">' + p.name + '</div>' +
        '<div class="plan-price">¥' + price.toLocaleString() + '</div>' +
        '<div class="plan-cycle">' + cycleLabel + '</div>' +
        '<ul class="plan-features">' +
        '<li>积分额度: ' + (p.included_credits || 0).toLocaleString() + ' 积分/月</li>' +
        (p.features || []).map(f => '<li>' + f + '</li>').join("") +
        '</ul>' +
        '<button class="btn btn-primary" onclick="subscribe(\'' + p.tier + '\')">立即订阅</button>' +
        '</div>';
    }).join("");
  } catch (e) {
    grid.innerHTML = '<div class="empty">加载失败</div>';
  }
}

async function subscribe(tier) {
  if (!customerId) {
    showToast("请先登录", "error");
    return;
  }
  try {
    const res = await fetch("/api/portal_subscription", {
      method: "POST",
      headers: {"Content-Type": "application/json", "x-customer-id": customerId},
      body: JSON.stringify({tier, billing_cycle: currentCycle})
    });
    const data = await res.json();
    if (data.ok && data.data.checkout_url) {
      window.location.href = data.data.checkout_url;
    } else {
      showToast(data.error || "订阅失败", "error");
    }
  } catch (e) {
    showToast("请求失败", "error");
  }
}

async function loadUsage() {
  if (!customerId) return;
  document.getElementById("usage-section").style.display = "block";
  try {
    const res = await fetch("/api/portal/credits", {headers: {"x-customer-id": customerId}});
    const data = await res.json();
    if (!data.ok) return;
    const d = data.data;
    document.getElementById("usage-credits").textContent = (d.included_credits || 0).toLocaleString();
    document.getElementById("usage-used").textContent = (d.used_this_month || 0).toLocaleString();
    document.getElementById("usage-remaining").textContent = (d.remaining || 0).toLocaleString();
    document.getElementById("usage-reset").textContent = d.renews_at ? d.renews_at.slice(0, 10) : "—";
    const pct = d.included_credits ? Math.min(100, (d.used_this_month / d.included_credits) * 100) : 0;
    const bar = document.createElement("div");
    bar.className = "usage-bar";
    bar.innerHTML = '<div class="usage-bar-fill" style="width:' + pct + '%"></div>';
    document.getElementById("usage-section").appendChild(bar);
  } catch (e) {}
}

function showUpgradeModal(reason) {
  const modal = document.getElementById("modal");
  modal.innerHTML = '<div class="modal-content upgrade-modal">' +
    '<h3>需要升级订阅</h3>' +
    '<p>' + (reason || "您的积分不足或订阅已到期，请升级订阅以继续使用") + '</p>' +
    '<button class="btn btn-primary" onclick="closeModal();document.getElementById(\'plans-section\').scrollIntoView({behavior:\'smooth\'})">查看方案</button>' +
    '</div>';
  modal.classList.add("open");
}

async function initPay() {
  const btn = document.getElementById("btn-pay");
  const assetId = btn.dataset.asset;
  const a = allAssets.find(x => x.asset_id === assetId);
  if (!a) return;
  btn.disabled = true;
  btn.querySelector("#pay-loading").style.display = "inline-block";
  try {
    const res = await fetch("/api/purchase", {
      method: "POST",
      headers: {"Content-Type": "application/json", "x-customer-id": customerId},
      body: JSON.stringify({asset_id: assetId, amount_cny: a.price_cny_ref})
    });
    const data = await res.json();
    if (res.status === 402 || res.status === 403) {
      showUpgradeModal(data.error);
      return;
    }
    if (data.checkout_url) {
      window.location.href = data.checkout_url;
    } else if (data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      showToast("支付链路未配置,请联系客服", "error");
    }
  } catch (e) {
    showToast("请求失败: " + e.message, "error");
  } finally {
    btn.disabled = false;
    btn.querySelector("#pay-loading").style.display = "none";
  }
}

loadManifest();
loadSample();
renderPlans();
loadUsage();
</script>
</body>
</html>
