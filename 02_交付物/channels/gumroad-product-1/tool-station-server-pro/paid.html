<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>支付结果 · bingdashan</title>
<style>body{font-family:system-ui,sans-serif;background:#f7f7f7;color:#1a1a1a;max-width:600px;margin:0 auto;padding:40px 16px;text-align:center;line-height:1.7}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:30px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1{font-size:1.4rem}.ok{color:#059669;font-size:3rem}.wait{color:#d97706;font-size:3rem}.sub{color:#6b7280;font-size:.9rem;word-break:break-all}
a.btn{display:inline-block;margin-top:18px;background:#111;color:#fff;padding:10px 22px;border-radius:8px;text-decoration:none}</style></head>
<body><div class="box">
<div id="ic" class="wait">…</div>
<h1 id="h">正在确认支付结果</h1>
<div class="sub">订单号: <span id="t">-</span></div>
<div class="sub" id="s">请稍候,正在向支付宝查单…</div>
<a class="btn" id="back" href="/">返回工具箱</a>
</div>
<script>
var q=new URLSearchParams(location.search);
var out=q.get('out_trade_no')||q.get('t')||'';
var tries=0, max=8;
var PACKS={t30:30,t60:60,t300:300,t1000:1000};
document.getElementById('t').textContent=out||'-';
function done(slug,plan){
  var arc=/^t\d+$/.test(plan||'');
  try{
    if(arc&&slug){
      var mins=PACKS[plan]||0;
      var cur=parseInt(localStorage.getItem('bds_bal')||'0',10)||0;
      localStorage.setItem('bds_bal',String(cur+mins*60));
      localStorage.setItem('bds_arc'+slug,'1');
    } else if(slug){localStorage.setItem('bds_paid_'+slug,'1');localStorage.setItem('bds_use_'+slug,'0');}
  }catch(e){}
  document.getElementById('ic').className='ok';document.getElementById('ic').textContent='\u2713';
  document.getElementById('h').textContent=arc?'支付成功,时长已到账':'支付成功,已解锁';
  document.getElementById('s').textContent=arc?('已增加 '+(PACKS[plan]||0)+' 分钟娱乐时长,正在返回游戏…'):'感谢支持!正在返回你的工具…';
  var b=document.getElementById('back');
  if(arc&&slug){b.href='/arcade/'+encodeURIComponent(slug)+'/';b.textContent='返回游戏';setTimeout(function(){location.href=b.href;},1400);}
  else if(slug){b.href='/'+encodeURIComponent(slug)+'/';b.textContent='立即使用工具';setTimeout(function(){location.href=b.href;},1200);}
}
function poll(){
  if(!out){document.getElementById('ic').textContent='?';document.getElementById('h').textContent='未找到订单号';return;}
  tries++;
  fetch('/api/order?out_trade_no='+encodeURIComponent(out),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(j&&j.paid){done(j.slug,j.plan);return;}
    if(tries>=max){document.getElementById('ic').className='wait';document.getElementById('ic').textContent='!';document.getElementById('h').textContent='尚未确认到账';
      document.getElementById('s').textContent='若已扣款,通常 1 分钟内到账。可稍后回到工具页,会自动解锁;或把订单号反馈客服。';return;}
    setTimeout(poll,2500);
  }).catch(function(){ if(tries<max)setTimeout(poll,2500); });
}
poll();
</script>
</body></html>
