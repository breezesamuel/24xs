<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丙大山·管理仪表盘</title>
<style>
:root{--bg:#0a0f1a;--card:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#22c55e;--warn:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.logo{font-weight:700;font-size:1.25rem;color:var(--accent)}
h1{font-size:2rem;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .label{font-size:.8rem;color:var(--muted);text-transform:uppercase}
.stat .value{font-size:1.5rem;font-weight:700;color:var(--accent);margin-top:4px}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.section h2{font-size:1.25rem;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
th{color:var(--muted);font-weight:600}
.btn{padding:8px 16px;border-radius:8px;font-weight:600;font-size:.85rem;cursor:pointer;border:none;background:var(--accent);color:var(--bg)}
.btn-secondary{background:var(--border);color:var(--text)}
</style>
</head>
<body>
<div class="container">
<header><div class="logo">丙大山·管理仪表盘</div><a href="/" style="color:var(--muted);text-decoration:none">返回商城</a></header>
<h1>管理仪表盘</h1>
<div class="stats" id="stats"></div>
<div class="section">
<h2>最近订单</h2>
<table><thead><tr><th>订单号</th><th>客户</th><th>金额</th><th>状态</th><th>时间</th></tr></thead><tbody id="orders"></tbody></table>
</div>
<div class="section">
<h2>系统状态</h2>
<table><thead><tr><th>服务</th><th>状态</th><th>响应时间</th></tr></thead><tbody id="services"></tbody></table>
</div>
<div class="section">
<h2>快速操作</h2>
<button class="btn" onclick="location.href='/monitoring.html'">系统监控</button>
<button class="btn btn-secondary" onclick="location.href='/verify.html'">运行验证</button>
<button class="btn btn-secondary" onclick="location.href='/settings.html'">系统配置</button>
</div>
</div>
<script>
async function loadStats() {
  try {
    const res = await fetch("/api/admin/dashboard");
    const data = await res.json();
    if (data.ok) {
      const d = data.dashboard;
      document.getElementById("stats").innerHTML =
        '<div class="stat"><div class="label">总客户</div><div class="value">' + (d.total_customers || 0) + '</div></div>' +
        '<div class="stat"><div class="label">活跃客户</div><div class="value">' + (d.active_customers || 0) + '</div></div>' +
        '<div class="stat"><div class="label">总收入</div><div class="value">¥' + (d.total_revenue || 0).toLocaleString() + '</div></div>' +
        '<div class="stat"><div class="label">总订单</div><div class="value">' + (d.total_purchases || 0) + '</div></div>';
    }
  } catch (e) {
    document.getElementById("stats").innerHTML = '<div class="stat"><div class="label">错误</div><div class="value">无法加载</div></div>';
  }
}

async function loadOrders() {
  try {
    const res = await fetch("/api/admin/purchases");
    const data = await res.json();
    const tbody = document.getElementById("orders");
    if (data.ok && data.data && data.data.length) {
      tbody.innerHTML = data.data.slice(0, 10).map(o =>
        '<tr><td>' + o.purchase_id + '</td><td>' + (o.customer_id || "—") + '</td><td>¥' + (o.amount_cny || 0).toFixed(2) + '</td><td>' + o.status + '</td><td>' + new Date(o.created_at).toLocaleString() + '</td></tr>'
      ).join("");
    } else {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">暂无订单</td></tr>';
    }
  } catch (e) {
    document.getElementById("orders").innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--muted)">无法加载</td></tr>';
  }
}

async function loadServices() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    const tbody = document.getElementById("services");
    const services = data.services || {};
    tbody.innerHTML = Object.entries(services).map(([k, v]) =>
      '<tr><td>' + k + '</td><td><span style="color:' + (v === "up" ? "var(--accent)" : "var(--danger)") + '">' + (v === "up" ? "运行中" : "停止") + '</span></td><td>—</td></tr>'
    ).join("");
  } catch (e) {
    document.getElementById("services").innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted)">无法加载</td></tr>';
  }
}

loadStats();
loadOrders();
loadServices();
</script>
</body>
</html>
