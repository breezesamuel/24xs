<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丙大山·系统监控</title>
<style>
:root{--bg:#0a0f1a;--card:#111827;--border:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--accent:#22c55e;--warn:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);margin-bottom:24px}
.logo{font-weight:700;font-size:1.25rem;color:var(--accent)}
h1{font-size:2rem;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .label{font-size:.8rem;color:var(--muted);text-transform:uppercase}
.stat .value{font-size:1.5rem;font-weight:700;color:var(--accent);margin-top:4px}
.stat .value.ok{color:var(--accent)}
.stat .value.warn{color:var(--warn)}
.stat .value.error{color:var(--danger)}
.section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:24px}
.section h2{font-size:1.25rem;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--border);font-size:.85rem}
th{color:var(--muted);font-weight:600}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
.status-dot.up{background:var(--accent)}
.status-dot.down{background:var(--danger)}
</style>
</head>
<body>
<div class="container">
<header><div class="logo">丙大山·系统监控</div><span id="clock" style="color:var(--muted)"></span></header>
<h1>系统状态</h1>
<div class="stats" id="stats"></div>
<div class="section">
<h2>服务健康</h2>
<table><thead><tr><th>服务</th><th>状态</th><th>响应时间</th></tr></thead><tbody id="services"></tbody></table>
</div>
<div class="section">
<h2>最近事件</h2>
<table><thead><tr><th>时间</th><th>事件</th><th>详情</th></tr></thead><tbody id="events"></tbody></table>
</div>
</div>
<script>
async function loadHealth() {
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    const stats = document.getElementById("stats");
    const checks = data.checks || {};
    stats.innerHTML = Object.entries(checks).map(([k, v]) => {
      const cls = v.status === "ok" ? "ok" : "error";
      const val = k === "assets" ? (v.size_mb + " MB") : (v.status === "ok" ? "正常" : "异常");
      return '<div class="stat"><div class="label">' + k + '</div><div class="value ' + cls + '">' + val + '</div></div>';
    }).join("");
    const svc = document.getElementById("services");
    const services = data.services || {};
    svc.innerHTML = Object.entries(services).map(([k, v]) =>
      '<tr><td><span class="status-dot ' + (v === "up" ? "up" : "down") + '"></span>' + k + '</td><td>' + (v === "up" ? "运行中" : "停止") + '</td><td>—</td></tr>'
    ).join("");
  } catch (e) {
    document.getElementById("stats").innerHTML = '<div class="stat"><div class="label">错误</div><div class="value error">无法连接</div></div>';
  }
}

async function loadEvents() {
  try {
    const res = await fetch("/api/audit?action=list&limit=10");
    const data = await res.json();
    const tbody = document.getElementById("events");
    if (data.data && data.data.length) {
      tbody.innerHTML = data.data.map(l =>
        '<tr><td>' + new Date(l.timestamp).toLocaleString() + '</td><td>' + l.action + '</td><td>' + l.resource + '</td></tr>'
      ).join("");
    } else {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted)">暂无事件</td></tr>';
    }
  } catch (e) {
    document.getElementById("events").innerHTML = '<tr><td colspan="3" style="text-align:center;color:var(--muted)">无法加载</td></tr>';
  }
}

function tick() {
  document.getElementById("clock").textContent = new Date().toLocaleString();
}

tick();
loadHealth();
loadEvents();
setInterval(tick, 1000);
setInterval(loadHealth, 30000);
</script>
</body>
</html>
