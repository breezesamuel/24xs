name: Hidden AutoOps 24x7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if recently executed'
        required: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  hidden-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Run Hidden Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          HIDDEN_INT_MIN: '15'
        run: |
          echo "Starting orchestrator at $(date -u)"
          node scripts/hidden/hidden_orchestrator.mjs
          echo "Orchestrator completed at $(date -u)"

      - name: Upload Hidden State Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-autoops-state
          path: |
            autoops/hidden/
            scripts/hidden/**/*.log
          retention-days: 30
          compression-level: 6

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-autoops-failure-logs
          path: |
            autoops/hidden/log/
          retention-days: 7

      - name: Notify on Repeated Failures
        if: failure()
        run: |
          echo "::warning::Hidden AutoOps orchestrator failed. Check workflow logs and artifacts."
          # Could add Slack/Discord webhook here via secrets

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Check deployment health
        run: |
          echo "Health check placeholder - add curl to Vercel /api/internal/hidden/cron or custom health endpoint"