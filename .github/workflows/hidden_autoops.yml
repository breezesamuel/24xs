name: Hidden AutoOps 24x7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if recently executed'
        required: false
        type: boolean

# Default permissions denied; each job declares minimum needed
permissions: {}

concurrency:
  group: hidden-autoops-state-writer
  cancel-in-progress: false

jobs:
  # Security lint (zizmor + actionlint) — runs fast, blocks known bad patterns
  security-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run zizmor (static analysis for GitHub Actions)
        uses: zizmor-core/zizmor-action@main
      - name: Run actionlint
        run: |
          curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download_actionlint.bash | bash
          ./actionlint -color

  hidden-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needs write to commit state back (state = durable memory across runners)
    permissions:
      contents: write
    steps:
      - name: Checkout repository (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js (pinned)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Run Hidden Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AUTOOPS_SECRET: ${{ secrets.AUTOOPS_SECRET }}
          STOREFRONT_BASE: ${{ secrets.STOREFRONT_BASE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          HIDDEN_INT_MIN: '15'
        run: |
          echo "Starting orchestrator at $(date -u)"
          set +e
          node scripts/hidden/hidden_orchestrator.mjs
          code=$?
          echo "Orchestrator exited with code $code at $(date -u)"
          # 不静默失败：非零退出令本 step 失败（触发 GitHub 免费告警邮件）；
          # 后续 "if: always()" 步骤仍会回写状态，不会丢数据。
          exit $code

      - name: Commit state back (durable across runners)
        if: always()
        run: |
          bash scripts/hidden/commit_state.sh "autoops: state sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload Hidden State Artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hidden-autoops-state
          path: |
            autoops/hidden/
            scripts/hidden/**/*.log
          retention-days: 30
          compression-level: 6
          if-no-files-found: ignore

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hidden-autoops-failure-logs
          path: |
            autoops/hidden/log/
            autoops/hidden/watchdog.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # 独立 watchdog 任务：关键故障时独立失败 → GitHub 免费告警邮件
  watchdog:
    runs-on: ubuntu-latest
    needs: hidden-orchestrator
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js (pinned)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev
      - name: Run Watchdog (exit 1 on critical -> free email alert)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTOOPS_SECRET: ${{ secrets.AUTOOPS_SECRET }}
          STOREFRONT_BASE: ${{ secrets.STOREFRONT_BASE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: node scripts/hidden/agent/hidden_watchdog.mjs
      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hidden-autoops-watchdog
          path: |
            autoops/hidden/watchdog.jsonl
            autoops/hidden/real_alerts.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify on Repeated Failures
        if: failure()
        run: |
          echo "::warning::Hidden AutoOps orchestrator failed. Check workflow logs and artifacts."
          # Could add Slack/Discord webhook here via secrets

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Ping real storefront
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://tools.highkingflower.com/api/health || echo "000")
          echo "storefront health HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Storefront health returned $HTTP"
          fi