name: Hidden AutoOps 24x7

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run even if recently executed'
        required: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: hidden-autoops-state-writer
  cancel-in-progress: false

jobs:
  hidden-orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev

      - name: Run Hidden Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AUTOOPS_SECRET: ${{ secrets.AUTOOPS_SECRET }}
          STOREFRONT_BASE: ${{ secrets.STOREFRONT_BASE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          HIDDEN_INT_MIN: '15'
        run: |
          echo "Starting orchestrator at $(date -u)"
          node scripts/hidden/hidden_orchestrator.mjs || true
          echo "Orchestrator completed at $(date -u)"

      - name: Commit state back (durable across runners)
        if: always()
        run: |
          bash scripts/hidden/commit_state.sh "autoops: state sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload Hidden State Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-autoops-state
          path: |
            autoops/hidden/
            scripts/hidden/**/*.log
          retention-days: 30
          compression-level: 6
          if-no-files-found: ignore

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-autoops-failure-logs
          path: |
            autoops/hidden/log/
            autoops/hidden/watchdog.jsonl
          retention-days: 7
          if-no-files-found: ignore

  # 独立 watchdog 任务：关键故障时独立失败 → GitHub 免费告警邮件
  watchdog:
    runs-on: ubuntu-latest
    needs: hidden-orchestrator
    if: always()
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev 2>/dev/null || npm install --omit=dev
      - name: Run Watchdog (exit 1 on critical -> free email alert)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTOOPS_SECRET: ${{ secrets.AUTOOPS_SECRET }}
          STOREFRONT_BASE: ${{ secrets.STOREFRONT_BASE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
        run: node scripts/hidden/agent/hidden_watchdog.mjs
      - name: Upload watchdog report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hidden-autoops-watchdog
          path: |
            autoops/hidden/watchdog.jsonl
            autoops/hidden/real_alerts.jsonl
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify on Repeated Failures
        if: failure()
        run: |
          echo "::warning::Hidden AutoOps orchestrator failed. Check workflow logs and artifacts."
          # Could add Slack/Discord webhook here via secrets

  health-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Ping Vercel cron endpoint
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://deploy-full-nine.vercel.app/api/internal/hidden/cron || echo "000")
          echo "cron endpoint HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Vercel cron endpoint returned $HTTP"
          fi
      - name: Ping real storefront
        run: |
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://tools.highkingflower.com/api/health || echo "000")
          echo "storefront health HTTP: $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Storefront health returned $HTTP"
          fi