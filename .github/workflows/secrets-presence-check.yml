name: Secrets Presence Check

# 验证所有必需的 Secrets 已配置（不打印任何值）。
# 缺失即以非零退出码结束 → GitHub 自动发失败告警邮件（免费告警通道）。
on:
  schedule:
    - cron: '0 4 * * 1'   # 每周一 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AUTOOPS_SECRET: ${{ secrets.AUTOOPS_SECRET }}
          STOREFRONT_BASE: ${{ secrets.STOREFRONT_BASE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_AUTH: ${{ secrets.SMTP_AUTH }}
        run: |
          MISSING=""
          [ -n "$GH_TOKEN" ]          || MISSING="$MISSING GH_TOKEN"
          [ -n "$AUTOOPS_SECRET" ]   || MISSING="$MISSING AUTOOPS_SECRET"
          [ -n "$STOREFRONT_BASE" ]  || MISSING="$MISSING STOREFRONT_BASE"
          # AI_KEY：至少需要一个
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$AI_API_KEY" ]; then MISSING="$MISSING OPENROUTER_API_KEY|AI_API_KEY"; fi
          # SMTP：告警通道（可选，缺失则降级为 KV 兜底）
          if [ -z "$SMTP_HOST" ] || [ -z "$SMTP_AUTH" ]; then echo "::warning::SMTP 未配置（告警将降级为 KV 兜底通道）"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::缺少 Secrets:$MISSING"
            echo "请在 Settings -> Secrets and variables -> Actions 配置"
            exit 1
          fi
          echo "OK: 所有必需 Secrets 已配置"
